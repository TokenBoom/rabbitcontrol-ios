name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODEGEN_VERSION: "2.48.0"

jobs:
  ios-app:
    name: iOS App (build + test)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true
      - name: Install XcodeGen
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          ditto -x -k "$RUNNER_TEMP/xcodegen.zip" "$RUNNER_TEMP/xcodegen"
          echo "$(dirname "$(find "$RUNNER_TEMP/xcodegen" -type f -path '*/bin/xcodegen')")" >> "$GITHUB_PATH"
      - name: Download prebuilt xcframework
        env:
          XCF_TAG: "v0.1.8"
        run: |
          # 预编译产物由 rabbitcontrol-apple-media 的 Release xcframework 工作流发布;
          # 升级时同步修改 XCF_TAG(对应 media 仓的 release tag)。
          mkdir -p Vendor
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcf.tar.gz" \
            "https://github.com/TokenBoom/rabbitcontrol-apple-media/releases/download/${XCF_TAG}/RabbitControlCore.xcframework.tar.gz"
          tar -xzf "$RUNNER_TEMP/xcf.tar.gz" -C Vendor
          ls Vendor/RabbitControlCore.xcframework
      - name: Generate project
        run: xcodegen generate
      - name: Select simulator
        run: |
          destination="$(./scripts/simulator-destination.sh)"
          echo "destination: $destination"
          echo "DESTINATION=$destination" >> "$GITHUB_ENV"
      - name: Test
        shell: bash
        run: |
          # 与 Rust 仓库的 -D warnings 一致：CI 上编译警告视为错误
          xcodebuild test \
            -project RabbitControlIOS.xcodeproj \
            -scheme RabbitControlIOS \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | xcbeautify
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
