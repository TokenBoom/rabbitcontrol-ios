# RabbitControl iOS 的工程定义。
#
# RabbitControlIOS.xcodeproj 由 `xcodegen generate` 根据本文件生成，属于构建产物，不纳入版本控制；
# 修改本文件后需要重新生成。源码目录是 Xcode 同步文件夹，新增源码文件时无需改动本文件。
name: RabbitControlIOS

options:
  bundleIdPrefix: com.rabbitcontrol
  # 与中文界面保持一致，之后引入字符串目录时以此为源语言
  developmentLanguage: zh-Hans
  # 同步文件夹从该工程格式（Xcode 16）起可用
  projectFormat: xcode16_0
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "18.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # 严格并发检查下，类型默认隔离到 MainActor，并启用 approachable concurrency
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  RabbitControlSpec:
    type: library.static
    platform: iOS
    sources:
      - path: RabbitControlIOS/Generated
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rabbitcontrol.ios.spec
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

  RabbitControlIOS:
    type: application
    platform: iOS
    info:
      path: Generated/AppInfo.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        # 仅用标准 TLS(mTLS/HTTPS),声明豁免加密,TestFlight 免人工合规确认
        ITSAppUsesNonExemptEncryption: false
    sources:
      - path: RabbitControlIOS
        type: syncedFolder
        excludes:
          - Generated
          - "Generated/**"
    dependencies:
      - target: RabbitControlSpec
      # rabbitcontrol-core 预编译移动端 FFI 静态库,由 scripts/fetch-core-xcframework.sh 从 Release 拉取(静态链接,不嵌入)
      - framework: Vendor/RabbitControlCore.xcframework
        embed: false
      # VideoToolbox 解码链路依赖的系统框架(rc-decode-vt 手工 FFI)
      - sdk: VideoToolbox.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: LocalAuthentication.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rabbitcontrol.ios
        CODE_SIGN_ENTITLEMENTS: RabbitControlIOS/RabbitControlIOS.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Xcode 将构建设置与上方 info.properties 合并为最终 Info.plist。
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: RabbitControl
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "RabbitControl 需要本地网络权限以发现局域网内的设备并建立低延迟直连。"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "RabbitControl 使用面容 ID 解锁本地应用锁，保护远程控制与设备凭据安全。"

  RabbitControlIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RabbitControlIOSTests
        type: syncedFolder
    dependencies:
      - target: RabbitControlIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rabbitcontrol.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

  RabbitControlIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RabbitControlIOSUITests
        type: syncedFolder
    dependencies:
      - target: RabbitControlIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rabbitcontrol.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        # XCUITest 的 XCTestCase 子类不能整体隔离到 MainActor（会与 XCTest 中 nonisolated 的初始化方法冲突），
        # XCUITest 本身就在主线程上执行。
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  RabbitControlIOS:
    build:
      targets:
        RabbitControlIOS: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RabbitControlIOSTests
        - RabbitControlIOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
